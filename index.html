<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; height:100%; }
  #sumsub-websdk-container { width:100%; height:100%; }
</style>
</head>
<body>
  <div id="sumsub-websdk-container"></div>
  <script src="https://static.sumsub.com/idensic/static/sns-websdk-builder.js"></script>
  <script>
    function getTokenFromUrl() {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function initSumsub(accessToken) {
      var sdk = snsWebSdk
        .init(accessToken, function () {
          // No refresh mechanism for this POC - token is passed once via URL.
          // If it expires mid-session, reject to surface a clear error.
          return Promise.reject(new Error('Token expired - please restart verification.'));
        })
        .withConf({ lang: 'en' })
        .withOptions({ adaptIframeHeight: true })
        .on('idCheck.onStepCompleted', function (p) {
          console.log('onStepCompleted', p);
        })
        .on('idCheck.onApplicantSubmitted', function () {
          console.log('onApplicantSubmitted');
        })
        .on('idCheck.onError', function (err) {
          console.error('onError', err);
        })
        .build();
      sdk.launch('#sumsub-websdk-container');
    }

    var token = getTokenFromUrl();
    if (token) {
      initSumsub(token);
    } else {
      document.getElementById('sumsub-websdk-container').innerText =
        'No access token provided in URL.';
    }
  </script>
</body>
</html>
